name: Reusable WF - Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      image_name:
          required: false
          default: ${{ github.repository }}
          type: string
      docker_file:
            required: false
            default: Dockerfile
            type: string
      platforms:
            required: false
            default: "linux/amd64,linux/arm64"
            type: string

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io

jobs:

  build-container-image:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:

      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name }}


      # Needed to build the linux/arm64 layers of the multi-arch manifest from an amd64
      # runner. This is image build time only -- Amalgam itself is built natively.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.docker_file }}
          platforms: ${{ inputs.platforms }}
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ inputs.image_name }}:dev
          labels: ${{ steps.meta.outputs.labels }}
