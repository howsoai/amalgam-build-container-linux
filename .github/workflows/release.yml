name: Reusable WF - Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      image_name:
        required: false
        default: ${{ github.repository }}
        type: string
      docker_file:
        required: false
        default: Dockerfile
        type: string
      create_release:
        required: false
        default: true
        type: boolean
      platforms:
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io

jobs:

  build-and-release-container-image:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:

      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name }}

      - name: Login to container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Needed to build the linux/arm64 layers of the multi-arch manifest from an amd64
      # runner. This is image build time only -- Amalgam itself is built natively.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          file: ${{ inputs.docker_file }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ inputs.image_name }}:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ inputs.image_name }}:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create Release
        if: inputs.create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.version }}
          commit: ${{ github.sha }}
          name: "Amalgam Linux Build Container ${{ inputs.version }}"
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          makeLatest: legacy
